<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense - Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>✏️ Edit Expense</h1>
            <p><a href="{{ url_for('home') }}">← Back to Home</a></p>
        </header>

        <main>
            <form method="POST" class="expense-form">
                <div class="form-group">
                    <label for="description">Description:</label>
                    <input type="text" id="description" name="description" required value="{{ expense.description }}">
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹):</label>
                    <input type="number" id="amount" name="amount" step="0.01" required value="{{ expense.amount }}">
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Food" {% if expense.category == 'Food' %}selected{% endif %}>🍔 Food</option>
                        <option value="Transport" {% if expense.category == 'Transport' %}selected{% endif %}>🚗 Transport</option>
                        <option value="Shopping" {% if expense.category == 'Shopping' %}selected{% endif %}>🛍️ Shopping</option>
                        <option value="Entertainment" {% if expense.category == 'Entertainment' %}selected{% endif %}>🎬 Entertainment</option>
                        <option value="Bills" {% if expense.category == 'Bills' %}selected{% endif %}>📄 Bills</option>
                        <option value="Healthcare" {% if expense.category == 'Healthcare' %}selected{% endif %}>🏥 Healthcare</option>
                        <option value="Education" {% if expense.category == 'Education' %}selected{% endif %}>📚 Education</option>
                        <option value="Other" {% if expense.category == 'Other' %}selected{% endif %}>📌 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date" required value="{{ expense.date }}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">💾 Update Expense</button>
                    <a href="{{ url_for('home') }}" class="btn-cancel">❌ Cancel</a>
                </div>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 Expense Tracker. Built with ❤️ using Flask</p>
        </footer>
    </div>
</body>
</html>
