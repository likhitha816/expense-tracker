<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Add New Expense</h1>
            <p><a href="{{ url_for('home') }}">← Back to Home</a></p>
        </header>

        <main>
            <form method="POST" class="expense-form">
                <div class="form-group">
                    <label for="description">Description:</label>
                   <!-- Update the description input -->
	<input type="text" id="description" name="description" required 
       minlength="3" maxlength="100" 
       placeholder="e.g., Lunch at restaurant"
       title="Description must be at least 3 characters">

	<!-- Update the amount input -->
	<input type="number" id="amount" name="amount" step="0.01" 
       min="0.01" max="99999999" required 
       placeholder="e.g., 250.00"
       title="Amount must be greater than 0">

	<!-- Update the date input -->
	<input type="date" id="date" name="date" required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹):</label>
                    <input type="number" id="amount" name="amount" step="0.01" required placeholder="e.g., 250.00">
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category" name="category" required>
                        <option value="">Select a category</option>
                        <option value="Food">🍔 Food</option>
                        <option value="Transport">🚗 Transport</option>
                        <option value="Shopping">🛍️ Shopping</option>
                        <option value="Entertainment">🎬 Entertainment</option>
                        <option value="Bills">📄 Bills</option>
                        <option value="Healthcare">🏥 Healthcare</option>
                        <option value="Education">📚 Education</option>
                        <option value="Other">📌 Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date:</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">💾 Save Expense</button>
                    <a href="{{ url_for('home') }}" class="btn-cancel">❌ Cancel</a>
                </div>
            </form>
        </main>

        <footer>
            <p>&copy; 2026 Expense Tracker. Built with ❤️ using Flask</p>
        </footer>
    </div>

    <script>
        // Set default date to today
        document.getElementById('date').value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
